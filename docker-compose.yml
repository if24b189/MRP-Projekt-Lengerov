services:
  postgres:
    image: postgres:latest
    container_name: mrp-postgres
    environment:
      POSTGRES_DB: mrp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "1234:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data: